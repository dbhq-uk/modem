[package]
name = "modem-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
modem-core = { path = "../modem-core" }
wasm-bindgen = { version = "0.2", optional = true }

[features]
default = ["browser"]
# The AudioWorklet build turns this off: see the module doc comment in
# src/lib.rs for why a wasm-bindgen surface and a worklet-loadable artifact
# cannot coexist in the same compiled module.
browser = ["dep:wasm-bindgen"]
