[package]
name = "modem-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "modem"
path = "src/main.rs"

[dependencies]
crossterm = "0.29.0"
modem-audio = { path = "../modem-audio" }
modem-core = { path = "../modem-core" }
ratatui = "0.30.2"

[dev-dependencies]
# Test-only: the tokens agreement test (tests/tokens_agree.rs) reads
# brand/tokens.json independently of the generator, so it needs a real
# JSON parser rather than one written for the occasion - see that test's
# own doc for why. Never used outside tests, so it does not touch the
# binary or the WASM build.
serde_json = "1"
