name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  # WHICH COMMIT IS BEING RELEASED, decided once and passed to everything
  # else (issue #5, found by the end-to-end review on 16 Sep 2026).
  #
  # `workflow_dispatch` takes a tag and the publish step below releases
  # to it, but `actions/checkout` with no `ref` uses the *triggering*
  # ref - the branch you dispatched from. So dispatching from main with
  # `tag: v0.1.0` built current main and attached those binaries to the
  # v0.1.0 release, with nothing in the run saying so. That is not a
  # hypothetical for this repo: the v0.1.0 tag was deleted and re-pushed
  # on 16 Sep after a runner problem, and a dispatch is the obvious way
  # to retry that.
  #
  # This resolves the requested tag to an immutable SHA, fails if it does
  # not exist, and every job below checks out that SHA rather than a ref
  # that can move under them.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      sha: ${{ steps.pick.outputs.sha }}
    steps:
      # No `ref` here, deliberately: this job is the one that decides
      # what the ref should be, so it takes the default checkout and
      # looks the tag up in it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Tags are not fetched by default, and this job exists to look
          # one up.
          fetch-depth: 0

      - id: pick
        env:
          REQUESTED: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${REQUESTED:-${GITHUB_REF_NAME}}"
          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "no such tag: ${TAG}"
            echo "a release must name a tag that exists - push the tag first"
            exit 1
          fi
          # ^{} dereferences an annotated tag to the commit it points at.
          SHA=$(git rev-parse "refs/tags/${TAG}^{}")
          echo "releasing ${TAG} at ${SHA}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide whether the others work -
      # the device matrix wants every result, including the bad ones.
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: modem
          - label: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            binary: modem
          # Cross-compiled on the Apple Silicon runner rather than built
          # natively on macos-13.
          #
          # GitHub is retiring its Intel macOS runners, and on 16 Sep
          # 2026 this job sat queued for the better part of fifteen
          # minutes while the other three finished in under five. A
          # release that cannot be cut because one scarce runner never
          # arrives is not a release process.
          #
          # Xcode ships both SDKs, so the ARM runner builds this target
          # directly. The binary is still smoke-tested below: GitHub's
          # macOS ARM images carry Rosetta 2, so an x86_64 binary runs
          # there. If that ever stops being true this job fails loudly at
          # the run check rather than shipping something untested.
          - label: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            binary: modem
          - label: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: modem.exe

    steps:
      # The resolved commit, not the triggering ref - see the resolve job.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}

      # cpal opens the sound card through ALSA on Linux, so the headers
      # have to be there even though the runner has no audio device.
      - name: Install ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Build
        run: cargo build --release --locked -p modem-tui --target ${{ matrix.target }}

      # "Compiling is not passing" is this project's own rule for the
      # device matrix, and it applies to a release artifact too. This is
      # the weakest check that is still a real one: the binary starts,
      # exits cleanly, and prints what it should. It cannot open a sound
      # card here - no runner has one - so it deliberately does not try.
      - name: The binary must actually run
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          OUT=$("$BIN" --help)
          echo "$OUT"
          grep -q "Bell 103" <<<"$OUT"
          grep -q -- "--acoustic" <<<"$OUT"
          grep -q -- "--answer" <<<"$OUT"

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          STAGE="modem-${{ matrix.label }}"
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$STAGE/"
          cp README.md "$STAGE/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "$STAGE.zip" "$STAGE"
          else
            tar czf "$STAGE.tar.gz" "$STAGE"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: modem-${{ matrix.label }}
          path: |
            modem-*.tar.gz
            modem-*.zip
          if-no-files-found: error

  publish:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    steps:
      # The same resolved commit the binaries were built from. This job
      # only needs a checkout at all so the release notes are generated
      # against the right history, but taking the default ref here while
      # `build` took the tag would be the same inconsistency in miniature.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: List what is being published
        run: ls -la dist

      # Every platform in the matrix has to have produced something. A
      # release quietly missing macOS because that leg failed is worse
      # than no release, and `fail-fast: false` means the build job can
      # go green-ish with a hole in it.
      - name: Every platform must be present
        run: |
          set -euo pipefail
          for label in linux-x86_64 macos-aarch64 macos-x86_64 windows-x86_64; do
            ls dist/modem-$label.* >/dev/null 2>&1 \
              || { echo "missing artifact for $label"; exit 1; }
          done
          echo "all four platforms present"

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          files: dist/*
          generate_release_notes: true
          body: |
            Binaries for Linux, macOS (Apple silicon and Intel) and Windows.

            The overture is performed. The connection is real Bell 103 FSK
            at 300 baud. See the README for which parts are which.

            Run `modem` for the two-pane demo on one machine, or
            `modem --single --acoustic` on two machines with `ATDT<digits>`
            on one and `ATA` on the other.

            Built from ${{ needs.resolve.outputs.sha }}.
