name: deploy

# Push to main -> modem.dbhq.uk is deployed, the edge cache purged, and the
# result verified with a cache-buster. The purge is the step that gets
# forgotten by hand, and forgetting it means the site silently serves stale
# files. It is not optional.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "brand/**"
      - "modem-wasm/**"
      - "modem-core/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-modem
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to commit SHAs, not tags - a hijacked tag would run
      # with our Cloudflare credentials in scope.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-unknown-unknown

      # The worklet artifact is BUILT here, not compared against a
      # committed copy.
      #
      # It used to be rebuilt and byte-compared, and that check could never
      # pass: a release wasm embeds absolute source paths in its panic
      # strings, so the same source produces different bytes on a developer
      # machine (/home/devops/src/modem/...) and on a runner
      # (/home/runner/work/modem/modem/...). Every deploy since the check
      # was added failed on it. The committed web/modem.wasm still exists
      # for local preview, where there is no build step; what ships is
      # this build, from this commit, which is a stronger guarantee than
      # the comparison was pretending to give.
      - name: Build the worklet artifact
        run: |
          set -euo pipefail
          cargo build --release --target wasm32-unknown-unknown \
            -p modem-wasm --no-default-features

      # The page loads brand/tokens.css and brand/icon.svg from a sibling
      # directory, so the upload is the repo root minus everything that is not
      # servable. Assembled explicitly rather than uploading the whole tree:
      # this is a public repo and the source has no business being served.
      - name: Assemble the upload
        # scripts/build-dist.sh, not an inline copy of it: the smoke tests
        # in ci.yml assemble the tree the same way and drive a browser at
        # it, so the thing tested is the thing shipped. Two copies of this
        # would drift the first time either changed, and the route
        # directories it builds - with their injected <base href="/"> -
        # are part of what those tests check.
        run: ./scripts/build-dist.sh

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name modem --branch main

      # The token goes in via env, not interpolated into the command line, so
      # it cannot surface in a traced command or an error message.
      - name: Purge the Cloudflare cache
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          RESP=$(curl -sf -X POST \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE}/purge_cache" \
            --data '{"purge_everything":true}')
          echo "$RESP"
          echo "$RESP" | grep -q '"success":true'

      # A freshly purged edge does not serve the new bytes everywhere the
      # instant the purge returns, so a single immediate request fails at
      # random on a deploy that actually worked - which is what happened on
      # 9 Sep 2026, twice. Every check below polls instead.
      - name: Wait for the edge to serve the new deploy
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            CODE=$(curl -sL -o /dev/null -w "%{http_code}" "https://modem.dbhq.uk/?cb=${GITHUB_SHA}-$i")
            [ "$CODE" = "200" ] && { echo "edge serving after $i attempts"; exit 0; }
            echo "attempt $i: $CODE"
            sleep 6
          done
          echo "edge never served a 200 after 20 attempts"
          exit 1

      # Cache-busted: a plain request can still be served a stale edge copy
      # right after a purge.
      - name: Verify the deploy is live
        run: |
          set -euo pipefail
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://modem.dbhq.uk/?cb=${GITHUB_SHA}")
          echo "modem.dbhq.uk -> $CODE"
          [ "$CODE" = "200" ]

      # Six real pages as of task 3n (9 Sep 2026) - the single page this
      # site used to be is gone, so every one of these has to actually
      # serve, not just the root. Same polling pattern as the edge-wait
      # step above: a freshly purged edge does not serve everywhere the
      # instant the purge returns.
      - name: The six pages must be serving
        run: |
          set -euo pipefail
          for path in "" explained research downloads projects about; do
            CODE=""
            for i in $(seq 1 10); do
              CODE=$(curl -sL -o /dev/null -w "%{http_code}" "https://modem.dbhq.uk/${path}?cb=${GITHUB_SHA}-$i")
              [ "$CODE" = "200" ] && break
              sleep 6
            done
            echo "/${path} -> $CODE"
            [ "$CODE" = "200" ]
          done

      # explained.html absorbed links.html entirely on 9 Sep 2026 - the old
      # file is gone from the repo, so the only thing standing between an
      # old /links link and a 404 is this _redirects rule actually shipping.
      - name: /links must redirect to /explained
        run: |
          set -euo pipefail
          REDIRECT_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://modem.dbhq.uk/links?cb=${GITHUB_SHA}")
          FINAL=$(curl -sL -o /dev/null -w "%{url_effective}" "https://modem.dbhq.uk/links?cb=${GITHUB_SHA}")
          echo "/links -> $REDIRECT_CODE, final $FINAL"
          case "$FINAL" in
            *"/explained"*) ;;
            *) echo "landed at $FINAL, not /explained"; exit 1 ;;
          esac

      # The demo is the entire point of the page, and it cannot run without
      # the WASM. A 200 on the HTML with a 404 on the payload is a page that
      # looks fine and does nothing.
      - name: The WASM payload must be serving
        run: |
          set -euo pipefail
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://modem.dbhq.uk/modem.wasm?cb=${GITHUB_SHA}")
          echo "modem.wasm -> $CODE"
          [ "$CODE" = "200" ]

      # /demo, /originate and /receive are _redirects rewrites, not real
      # files - the one thing that can silently break them is _redirects
      # itself not making the upload (a glob typo, a missed cp) with
      # nothing else here to notice, since the plain "/" check above
      # would still pass.
      - name: The three routes must be serving
        run: |
          set -euo pipefail
          # -L, because the routes are real directories: Cloudflare Pages
          # 308s /demo to /demo/ before serving it, and that redirect is
          # correct. Asserting on the unfollowed status fails a deploy that
          # actually worked. The final URL is checked too, so a redirect
          # that quietly landed somewhere else - which is exactly what the
          # earlier _redirects rewrites did, sending every route to / and
          # breaking shared links - still fails.
          for route in demo originate receive; do
            CODE=$(curl -sL -o /dev/null -w "%{http_code}" "https://modem.dbhq.uk/${route}?cb=${GITHUB_SHA}")
            FINAL=$(curl -sL -o /dev/null -w "%{url_effective}" "https://modem.dbhq.uk/${route}?cb=${GITHUB_SHA}")
            echo "/${route} -> $CODE at $FINAL"
            [ "$CODE" = "200" ]
            case "$FINAL" in
              *"/${route}/"*) ;;
              *) echo "landed at $FINAL, not the route itself"; exit 1 ;;
            esac
          done

      # AudioWorklet instantiation needs 'wasm-unsafe-eval' in script-src.
      # Without it the demo fails at the edge and works perfectly in local
      # testing, which is the worst possible way to find out.
      - name: The CSP must permit WASM
        run: |
          set -euo pipefail
          CSP=$(curl -sI "https://modem.dbhq.uk/?cb=${GITHUB_SHA}" \
            | tr -d '\r' | grep -i '^content-security-policy:' || true)
          echo "$CSP"
          if [ -z "$CSP" ]; then
            echo "::warning::no Content-Security-Policy header served"
          elif ! grep -q "wasm-unsafe-eval" <<<"$CSP"; then
            echo "CSP is present but does not permit wasm-unsafe-eval - the demo will not run"
            exit 1
          fi
