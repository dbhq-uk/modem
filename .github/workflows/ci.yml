name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Kept from deploy.yml, which had it: a manual re-deploy has to stay
  # possible, and now it re-runs every check on the way.
  workflow_dispatch:

# The default for every job below. A job that needs more declares it itself;
# an explicit floor here means a new job cannot silently inherit an org
# setting somebody widened.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Install minimodem for cross-validation
        # The runner image ships a Google Chrome apt source this project
        # has no use for, and `apt-get update` fails the whole step when
        # that third-party index is briefly inconsistent - which is
        # exactly what happened on 9 Sep 2026, twice in a row, on a
        # commit that touched one CSS file. Dropping the list first
        # means an outage at dl.google.com cannot fail our build.
        run: |
          set -euo pipefail
          # Best effort: the runner image ships third-party apt sources
          # (Google Chrome) this project has no use for, under a filename
          # that has changed between image versions - so glob rather than
          # name one.
          sudo rm -f /etc/apt/sources.list.d/*google* || true
          # `apt-get update` exits non-zero if ANY configured index is
          # briefly inconsistent, even when every index we actually need
          # downloaded fine ("old ones used instead"). That failed this
          # build three times in a row today on a commit touching one CSS
          # file. The install below is the real gate: if a package cannot
          # be found the step still fails, which is the condition worth
          # failing on.
          sudo apt-get update || true
          sudo apt-get install -y minimodem libasound2-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      # The default feature set never touches the --no-default-features
      # build the worklet actually loads, so it needs its own clippy pass.
      - run: cargo clippy --all-targets -p modem-wasm --no-default-features -- -D warnings
      # modem-audio/tests/interop.rs skips gracefully when minimodem is
      # absent, so `cargo test` alone cannot tell "cross-validated" from
      # "quietly skipped" - both print `test result: ok`. Task 9's own
      # mutation 4 proved this: hard-coding the skip-if-absent check to
      # always report absent left the suite green with zero minimodem
      # invocations. This step is the independent check that catches
      # that - it fails on a missing binary, and it fails again if the
      # tests themselves never actually ran against one, by grepping for
      # the RAN/SKIP markers each test prints regardless of pass or fail.
      - name: minimodem cross-validation must actually run, not skip
        run: |
          set -o pipefail
          cargo test -p modem-audio --test interop -- --nocapture 2>&1 | tee /tmp/interop.log
          if grep -q '^SKIP' /tmp/interop.log; then
            echo "minimodem cross-validation was skipped - minimodem must be present in CI"
            exit 1
          fi
          grep -q 'RAN (minimodem_decodes_our_tx)' /tmp/interop.log \
            || { echo "minimodem_decodes_our_tx did not run"; exit 1; }
          grep -q 'RAN (we_decode_minimodem_tx)' /tmp/interop.log \
            || { echo "we_decode_minimodem_tx did not run"; exit 1; }
      - run: cargo test --workspace

  no_std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown
      # If modem-core ever gains an I/O dependency this fails to compile.
      # That is the whole point - there is no grep heuristic to get wrong.
      - name: modem-core must build for wasm32
        run: cargo build -p modem-core --target wasm32-unknown-unknown

  worklet_artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown
      - name: Build the worklet artifact
        run: cargo build --release --target wasm32-unknown-unknown -p modem-wasm --no-default-features
      # The worklet instantiates with an empty import object, so any import
      # at all breaks it at runtime. A wasm-bindgen item anywhere in the
      # crate reintroduces one, which is why this is a build gate and not a
      # code review question. See spike/README.md.
      - name: Worklet artifact must have zero imports
        run: |
          python3 - <<'PY'
          import sys

          data = open('target/wasm32-unknown-unknown/release/modem_wasm.wasm', 'rb').read()
          assert data[:4] == b'\x00asm', 'not a wasm module'

          def uleb(buf, i):
              result = shift = 0
              while True:
                  byte = buf[i]
                  i += 1
                  result |= (byte & 0x7F) << shift
                  if not byte & 0x80:
                      return result, i
                  shift += 7

          i = 8
          while i < len(data):
              section_id = data[i]
              i += 1
              size, i = uleb(data, i)
              if section_id == 2:
                  count, _ = uleb(data, i)
                  if count:
                      print(f'FAIL: worklet artifact declares {count} imports')
                      sys.exit(1)
              i += size
          print('worklet artifact has zero imports')
          PY

      - name: Report payload size
        run: |
          W=target/wasm32-unknown-unknown/release/modem_wasm.wasm
          echo "raw: $(stat -c%s $W) bytes"
          echo "gzipped: $(gzip -9 -c $W | wc -c) bytes"

  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: The README's terminal frame must line up
        # A box-drawn frame whose rows are not all the same width does not
        # render as a box - the right border steps in and out and the
        # whole thing reads as broken. Found on 10 Sep 2026 with two
        # waterfall rows at 71 characters against a 72-character border,
        # which is invisible in a diff and obvious on the repo's front
        # page. Character count, not display width: every glyph in the
        # frame is East-Asian Ambiguous, so it is one cell wide in the
        # Latin monospace GitHub actually renders it in.
        run: |
          python3 - <<'PY'
          import re
          import sys
          from pathlib import Path

          text = Path('README.md').read_text()
          in_block = False
          rows = []
          for number, line in enumerate(text.splitlines(), 1):
              if line.startswith('```'):
                  in_block = not in_block
                  continue
              if in_block and re.match(r'^[\u2551\u2554\u255a\u2560]', line):
                  rows.append((number, len(line), line[:24]))

          if not rows:
              sys.exit("no box-drawn frame found in README.md - has it moved?")

          widths = {width for _, width, _ in rows}
          if len(widths) > 1:
              print("README.md's terminal frame has rows of different widths:")
              for number, width, start in rows:
                  print(f"  line {number}: {width} chars  {start!r}")
              sys.exit(f"widths seen: {sorted(widths)} - every row must match the border")

          print(f"{len(rows)} frame rows, all {widths.pop()} characters")
          PY

      # Repo rule: plain hyphens only, never em or en dashes.
      - name: No em dashes or en dashes
        run: |
          if grep -rnP '[\x{2013}\x{2014}]' --include='*.rs' --include='*.md' \
               --include='*.js' --include='*.html' --include='*.toml' \
               --include='*.yml' . ; then
            echo "em or en dash found - use a plain hyphen"
            exit 1
          fi
          echo "no em or en dashes"

  # The project ships three platforms, but everything above this line runs
  # on Linux only - so until now a Windows-breaking change stayed
  # invisible until somebody tagged a release, which is the worst possible
  # moment to find it. This builds and runs the binary on the other two.
  cross_platform:
    name: build on ${{ matrix.os }} ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: ""
          - os: windows-latest
            target: ""
          # Intel macOS, cross-compiled on the Apple Silicon runner the
          # same way the release builds it.
          #
          # This was the one target the release shipped that CI never
          # touched, and on 16 Sep 2026 it was the one that broke the
          # release: GitHub is retiring its Intel runners, the macos-13
          # job never started, and the whole thing stalled. Covering it
          # here means a change that breaks this target fails on the
          # commit that causes it rather than at a tag.
          - os: macos-latest
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --release --locked -p modem-tui --target "${{ matrix.target }}"
          else
            cargo build --release --locked -p modem-tui
          fi
      # Compiling is not passing - this project's own rule for the device
      # matrix, applied to CI. The binary starts, exits cleanly and prints
      # what it should. It cannot open a sound card on a runner and does
      # not try.
      - name: The binary must actually run
        shell: bash
        run: |
          set -euo pipefail
          DIR=target/release
          [ -n "${{ matrix.target }}" ] && DIR="target/${{ matrix.target }}/release"
          BIN="$DIR/modem"
          [ "${{ runner.os }}" = "Windows" ] && BIN="$DIR/modem.exe"
          OUT=$("$BIN" --help)
          grep -q "Bell 103" <<<"$OUT"
          grep -q -- "--answer" <<<"$OUT"
      # The unit tests are platform-independent in principle. "In
      # principle" is exactly the kind of claim that turns out to be false
      # on Windows line endings or macOS float behaviour.
      # Skipped for the cross-compiled target: these tests run on the
      # host, and a host cannot run another architecture's test binaries
      # without help. The build and the --help run above are what this
      # entry is for.
      - if: matrix.target == ''
        run: cargo test --workspace --exclude modem-audio

  # Everything under brand/ except _gen/ is generated, and so is the pair
  # of terminal frames inside web/index.html's "Two ways to try this"
  # section (web/_gen/frames.py), and the shared nav/footer/consent
  # regions on all seven web/*.html pages (web/_gen/pages.py, added task
  # 3n, 9 Sep 2026). Nothing stopped somebody hand-editing an SVG or a
  # marked HTML region, or editing a generator and forgetting to
  # regenerate - both leave the committed asset disagreeing with its own
  # source, silently. This regenerates and fails on any diff.
  generated_assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # web/_gen/frames.py runs modem-tui's mockup example to get its
      # frames - needs a toolchain, and libasound2-dev for modem-audio's
      # cpal dependency to build at all, same package the `test` job
      # installs for the same reason.
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
        with:
          toolchain: 1.98.1
      - name: Install the tools the generators need
        # See the `test` job's own note on why the Google Chrome apt
        # source is removed before updating.
        run: |
          set -euo pipefail
          # Best effort: the runner image ships third-party apt sources
          # (Google Chrome) this project has no use for, under a filename
          # that has changed between image versions - so glob rather than
          # name one.
          sudo rm -f /etc/apt/sources.list.d/*google* || true
          # `apt-get update` exits non-zero if ANY configured index is
          # briefly inconsistent, even when every index we actually need
          # downloaded fine ("old ones used instead"). That failed this
          # build three times in a row today on a commit touching one CSS
          # file. The install below is the real gate: if a package cannot
          # be found the step still fails, which is the condition worth
          # failing on.
          sudo apt-get update || true
          sudo apt-get install -y librsvg2-bin imagemagick libasound2-dev
      # Every generator, discovered rather than listed - a new one added
      # to brand/_gen/ or web/_gen/ is covered the moment it lands,
      # instead of silently sitting outside this check until somebody
      # remembers to add it.
      - name: Run every generator
        run: |
          set -euo pipefail
          for g in brand/_gen/*.py web/_gen/*.py; do
            echo "running $g"
            python3 "$g"
          done
      - name: Generated assets must match their generators
        run: |
          # Every page pages.py touches, explicitly - a generator that
          # gains a new page and forgets to list it here would pass this
          # check while silently shipping a stale region on that page.
          if ! git diff --exit-code -- brand/ web/index.html web/explained.html web/research.html web/debugging.html web/downloads.html web/about.html web/404.html; then
            echo
            echo "A generated file differs from what its generator produces."
            echo "Either it was hand-edited, or a generator changed and nobody"
            echo "re-ran it. Run the scripts under brand/_gen/ and web/_gen/ and"
            echo "commit the result."
            exit 1
          fi
          echo "generated assets match their generators"

  # The page's argument for plain HTML and no framework is that bytes
  # matter next to the WASM payload. That argument needs a number behind
  # it, or the payload quietly triples and nobody notices.
  payload_budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown
      - run: cargo build --release --target wasm32-unknown-unknown -p modem-wasm --no-default-features
      - name: Gzipped payload must stay under budget
        run: |
          set -euo pipefail
          W=target/wasm32-unknown-unknown/release/modem_wasm.wasm
          GZ=$(gzip -9 -c "$W" | wc -c)
          BUDGET=32768
          echo "gzipped: $GZ bytes, budget: $BUDGET"
          if [ "$GZ" -gt "$BUDGET" ]; then
            echo "payload is over budget - either trim it or raise the budget deliberately"
            exit 1
          fi

  # A public repo with dependencies should know when one of them is
  # withdrawn or has an advisory filed against it.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Browser smoke tests: the site actually working, in a real browser,
  # against the exact tree the deploy uploads.
  #
  # Added 10 Sep 2026 because every check in this file passed through four
  # consecutive shipped defects that made the page do nothing - a null
  # canvas that killed page.js outright, a WASM URL that 404ed from the
  # landing page but not from a direct link, launcher buttons that shipped
  # disabled and a cached script that never enabled them, and a status
  # tally contradicting its own caption. Each one served a perfect 200
  # while the demo was dead, which is exactly what a check for "the file
  # exists and the URL returns 200" cannot see. Dan found all four.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Try to give Chromium an audio output device
        # Chromium needs one or `audioWorklet.addModule` never settles: the
        # audio rendering thread never starts, the module is never even
        # fetched, and the demo cannot run. Measured directly - the
        # AudioContext still reports `state: "running"` and exposes
        # `audioWorklet`, so every ordinary capability check says yes while
        # nothing works.
        #
        # Best effort, and the tests do not depend on it succeeding. The
        # two that need a live AudioWorklet probe for it and skip with a
        # reason when it is absent (see web/tests/smoke.spec.mjs); the
        # other twenty-six need no audio at all and are the ones that would
        # have caught every defect that reached Dan. A permanent red here
        # would get ignored, and ignoring it would waste those.
        run: |
          set -euo pipefail
          sudo rm -f /etc/apt/sources.list.d/*google* || true
          sudo apt-get update || true
          sudo apt-get install -y alsa-utils libasound2-dev pulseaudio pulseaudio-utils || true
          sudo modprobe snd-dummy || true
          pulseaudio --check || pulseaudio -D --exit-idle-time=-1 || true
          pactl load-module module-null-sink sink_name=ci || true
          pactl list short sinks || echo "no sink available - the two audio tests will skip"
      - name: Build the worklet artifact
        run: cargo build --release --target wasm32-unknown-unknown -p modem-wasm --no-default-features
      - name: Assemble the deployable tree
        run: ./scripts/build-dist.sh
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - name: Smoke test the assembled site
        run: npx playwright test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: |
            test-results/
          retention-days: 7

  # actionlint over the workflows themselves.
  #
  # Added 17 Sep 2026 after a hand-written edit put two `with:` keys on
  # one step, the second referencing `needs.resolve` from inside the
  # `resolve` job. Python's yaml.safe_load accepts a duplicate key and
  # silently keeps the last one, so a local check said the file was fine;
  # GitHub rejected the whole workflow and reported it as a run named
  # after the file with no jobs and no log. actionlint names the line.
  #
  # This is cheap and it checks the thing nothing else here checks - the
  # workflows are the only code in the repo with no test.
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: actionlint
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD":/repo -w /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color

  # THE DEPLOY IS A CI JOB, not its own workflow (issue #7, 17 Sep 2026).
  #
  # It used to be .github/workflows/deploy.yml, triggered on push to main
  # exactly as this file is - two workflows racing, neither waiting for
  # the other. A change that failed the smoke tests, the generated-assets
  # diff or clippy was deployed anyway, and the only sign was a red CI run
  # sitting next to a green deploy. The deploy's own checks are mostly
  # curl for HTTP 200, which a thoroughly broken page serves perfectly
  # well - that is the whole reason web/tests/smoke.spec.mjs exists (see
  # its header).
  #
  # `needs` is every job above, spelled out rather than summarised: a new
  # job added to this file must be added here too, and a reviewer seeing
  # a name missing from this list is the point. `if` keeps it to pushes
  # on main, so pull requests run all the checks and ship nothing.
  #
  # WHAT THIS COSTS, stated because it is real: deploy.yml carried a path
  # filter (web/**, brand/**, modem-wasm/**, modem-core/**), so a
  # README-only push skipped the deploy entirely. Now every push to main
  # runs the full matrix before deciding, and then deploys regardless of
  # what changed. That is a few minutes of runner time against never
  # shipping an untested site, which is not a close call.
  deploy:
    needs:
      - test
      - no_std
      - workflows
      - worklet_artifact
      - style
      - cross_platform
      - generated_assets
      - payload_budget
      - audit
      - smoke
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || github.event_name == 'workflow_dispatch'
    # Carried over from deploy.yml, where it was workflow-level. Two
    # deploys uploading to the same Pages project at once is how you get
    # a half-written tree at the edge, and cancel-in-progress is wrong
    # here: an interrupted upload is worse than a queued one.
    concurrency:
      group: deploy-modem
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to commit SHAs, not tags - a hijacked tag would run
      # with our Cloudflare credentials in scope.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown

      # The worklet artifact is BUILT here, not compared against a
      # committed copy.
      #
      # It used to be rebuilt and byte-compared, and that check could never
      # pass: a release wasm embeds absolute source paths in its panic
      # strings, so the same source produces different bytes on a developer
      # machine (/home/devops/src/modem/...) and on a runner
      # (/home/runner/work/modem/modem/...). Every deploy since the check
      # was added failed on it. The committed web/modem.wasm still exists
      # for local preview, where there is no build step; what ships is
      # this build, from this commit, which is a stronger guarantee than
      # the comparison was pretending to give.
      - name: Build the worklet artifact
        run: |
          set -euo pipefail
          cargo build --release --target wasm32-unknown-unknown \
            -p modem-wasm --no-default-features

      # The page loads brand/tokens.css and brand/icon.svg from a sibling
      # directory, so the upload is the repo root minus everything that is not
      # servable. Assembled explicitly rather than uploading the whole tree:
      # this is a public repo and the source has no business being served.
      - name: Assemble the upload
        # scripts/build-dist.sh, not an inline copy of it: the smoke tests
        # in ci.yml assemble the tree the same way and drive a browser at
        # it, so the thing tested is the thing shipped. Two copies of this
        # would drift the first time either changed, and the route
        # directories it builds - with their injected <base href="/"> -
        # are part of what those tests check.
        run: ./scripts/build-dist.sh

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name modem --branch main

      # The token goes in via env, not interpolated into the command line, so
      # it cannot surface in a traced command or an error message.
      - name: Purge the Cloudflare cache
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          RESP=$(curl -sf -X POST \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE}/purge_cache" \
            --data '{"purge_everything":true}')
          echo "$RESP"
          echo "$RESP" | grep -q '"success":true'

      # A freshly purged edge does not serve the new bytes everywhere the
      # instant the purge returns, so a single immediate request fails at
      # random on a deploy that actually worked - which is what happened on
      # 9 Sep 2026, twice. Every check below polls instead.
      - name: Wait for the edge to serve the new deploy
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            CODE=$(curl -sL -o /dev/null -w "%{http_code}" "https://modem.dbhq.uk/?cb=${GITHUB_SHA}-$i")
            [ "$CODE" = "200" ] && { echo "edge serving after $i attempts"; exit 0; }
            echo "attempt $i: $CODE"
            sleep 6
          done
          echo "edge never served a 200 after 20 attempts"
          exit 1

      # Cache-busted: a plain request can still be served a stale edge copy
      # right after a purge.
      - name: Verify the deploy is live
        run: |
          set -euo pipefail
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://modem.dbhq.uk/?cb=${GITHUB_SHA}")
          echo "modem.dbhq.uk -> $CODE"
          [ "$CODE" = "200" ]

      # Six real pages as of 16 Sep 2026 (/debugging joined, /projects
      # went) - the single page this site used to be is gone, so every
      # one of these has to actually serve, not just the root. Same polling pattern as the edge-wait
      # step above: a freshly purged edge does not serve everywhere the
      # instant the purge returns.
      - name: The six pages must be serving
        run: |
          set -euo pipefail
          for path in "" explained research debugging downloads about; do
            CODE=""
            for i in $(seq 1 10); do
              CODE=$(curl -sL -o /dev/null -w "%{http_code}" "https://modem.dbhq.uk/${path}?cb=${GITHUB_SHA}-$i")
              [ "$CODE" = "200" ] && break
              sleep 6
            done
            echo "/${path} -> $CODE"
            [ "$CODE" = "200" ]
          done

      # Only once every page above has been confirmed serving. IndexNow
      # fetches the key file to verify the submission, and telling Bing
      # about URLs that are not up yet is worse than saying nothing.
      #
      # Not allowed to fail the deploy: the site is already live and
      # correct by this point, and a search engine's endpoint having a
      # bad minute is not a reason to go red on a good deploy.
      - name: Tell IndexNow
        continue-on-error: true
        run: ./scripts/indexnow-submit.sh

      # explained.html absorbed links.html entirely on 9 Sep 2026 - the old
      # file is gone from the repo, so the only thing standing between an
      # old /links link and a 404 is this _redirects rule actually shipping.
      - name: /links must redirect to /explained
        run: |
          set -euo pipefail
          REDIRECT_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://modem.dbhq.uk/links?cb=${GITHUB_SHA}")
          FINAL=$(curl -sL -o /dev/null -w "%{url_effective}" "https://modem.dbhq.uk/links?cb=${GITHUB_SHA}")
          echo "/links -> $REDIRECT_CODE, final $FINAL"
          case "$FINAL" in
            *"/explained"*) ;;
            *) echo "landed at $FINAL, not /explained"; exit 1 ;;
          esac

      # /projects was deleted on 16 Sep 2026 and its file is gone from the
      # repo, so the only thing standing between an old /projects link and
      # a 404 is this _redirects rule actually shipping - the same reason
      # the /links check above exists.
      - name: /projects must redirect to the root
        run: |
          set -euo pipefail
          REDIRECT_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://modem.dbhq.uk/projects?cb=${GITHUB_SHA}")
          FINAL=$(curl -sL -o /dev/null -w "%{url_effective}" "https://modem.dbhq.uk/projects?cb=${GITHUB_SHA}")
          echo "/projects -> $REDIRECT_CODE, final $FINAL"
          case "$FINAL" in
            *"modem.dbhq.uk/?"*|*"modem.dbhq.uk/") ;;
            *) echo "landed at $FINAL, not the root"; exit 1 ;;
          esac

      # The demo is the entire point of the page, and it cannot run without
      # the WASM. A 200 on the HTML with a 404 on the payload is a page that
      # looks fine and does nothing.
      - name: The WASM payload must be serving
        run: |
          set -euo pipefail
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://modem.dbhq.uk/modem.wasm?cb=${GITHUB_SHA}")
          echo "modem.wasm -> $CODE"
          [ "$CODE" = "200" ]

      # /demo, /originate and /receive are _redirects rewrites, not real
      # files - the one thing that can silently break them is _redirects
      # itself not making the upload (a glob typo, a missed cp) with
      # nothing else here to notice, since the plain "/" check above
      # would still pass.
      - name: The three routes must be serving
        run: |
          set -euo pipefail
          # -L, because the routes are real directories: Cloudflare Pages
          # 308s /demo to /demo/ before serving it, and that redirect is
          # correct. Asserting on the unfollowed status fails a deploy that
          # actually worked. The final URL is checked too, so a redirect
          # that quietly landed somewhere else - which is exactly what the
          # earlier _redirects rewrites did, sending every route to / and
          # breaking shared links - still fails.
          for route in demo originate receive; do
            CODE=$(curl -sL -o /dev/null -w "%{http_code}" "https://modem.dbhq.uk/${route}?cb=${GITHUB_SHA}")
            FINAL=$(curl -sL -o /dev/null -w "%{url_effective}" "https://modem.dbhq.uk/${route}?cb=${GITHUB_SHA}")
            echo "/${route} -> $CODE at $FINAL"
            [ "$CODE" = "200" ]
            case "$FINAL" in
              *"/${route}/"*) ;;
              *) echo "landed at $FINAL, not the route itself"; exit 1 ;;
            esac
          done

      # AudioWorklet instantiation needs 'wasm-unsafe-eval' in script-src.
      # Without it the demo fails at the edge and works perfectly in local
      # testing, which is the worst possible way to find out.
      - name: The CSP must permit WASM
        run: |
          set -euo pipefail
          CSP=$(curl -sI "https://modem.dbhq.uk/?cb=${GITHUB_SHA}" \
            | tr -d '\r' | grep -i '^content-security-policy:' || true)
          echo "$CSP"
          # A missing CSP used to be a warning. It is a failure now
          # (issue #7): the whole point of checking is that _headers can
          # silently stop shipping, and a warning in a green run is a
          # check nobody reads. If the header is genuinely gone, the site
          # has lost object-src, frame-ancestors, base-uri and the rest,
          # which is not a "note for later".
          if [ -z "$CSP" ]; then
            echo "no Content-Security-Policy header served - web/_headers is not reaching the edge"
            exit 1
          elif ! grep -q "wasm-unsafe-eval" <<<"$CSP"; then
            echo "CSP is present but does not permit wasm-unsafe-eval - the demo will not run"
            exit 1
          fi
